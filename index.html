<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>readcine · 导航</title>
<style>
  :root {
    --bg: #f4f5f2;
    --bg-grad: radial-gradient(1200px 600px at 50% -10%, #e9ebe4 0%, transparent 70%);
    --card: #ffffff;
    --card-hover: #ffffff;
    --border: #dcdfd9;
    --border-hover: #c3c7bf;
    --text: #14181f;
    --muted: #565f6b;
    --faint: #8b939c;
    --accent: #c8722c;
    --shadow: 0 1px 2px rgba(20,23,28,.06), 0 8px 24px rgba(20,23,28,.06);
    --shadow-hover: 0 2px 4px rgba(20,23,28,.08), 0 16px 40px rgba(20,23,28,.12);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0f14;
      --bg-grad: radial-gradient(1200px 600px at 50% -10%, #171c22 0%, transparent 70%);
      --card: #12161d;
      --card-hover: #171c24;
      --border: #262b33;
      --border-hover: #3a414b;
      --text: #e7ebe6;
      --muted: #9aa3ab;
      --faint: #6b7480;
      --accent: #e08a45;
      --shadow: none;
      --shadow-hover: 0 12px 32px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0f14;
    --bg-grad: radial-gradient(1200px 600px at 50% -10%, #171c22 0%, transparent 70%);
    --card: #12161d;
    --card-hover: #171c24;
    --border: #262b33;
    --border-hover: #3a414b;
    --text: #e7ebe6;
    --muted: #9aa3ab;
    --faint: #6b7480;
    --accent: #e08a45;
    --shadow: none;
    --shadow-hover: 0 12px 32px rgba(0,0,0,.4);
  }
  :root[data-theme="light"] {
    --bg: #f4f5f2;
    --bg-grad: radial-gradient(1200px 600px at 50% -10%, #e9ebe4 0%, transparent 70%);
    --card: #ffffff;
    --card-hover: #ffffff;
    --border: #dcdfd9;
    --border-hover: #c3c7bf;
    --text: #14181f;
    --muted: #565f6b;
    --faint: #8b939c;
    --accent: #c8722c;
    --shadow: 0 1px 2px rgba(20,23,28,.06), 0 8px 24px rgba(20,23,28,.06);
    --shadow-hover: 0 2px 4px rgba(20,23,28,.08), 0 16px 40px rgba(20,23,28,.12);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image: var(--bg-grad);
    background-repeat: no-repeat;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 72px 24px 56px; }

  header { margin-bottom: 40px; }
  .brand { margin: 0 0 8px; }
  /* 标题即刷新按钮：点一下重新探活，不另加一个按钮占地方 */
  .brand button {
    font: inherit;
    font-size: 30px; font-weight: 650; letter-spacing: -.02em;
    color: inherit;
    background: none; border: 0; padding: 0;
    cursor: pointer;
    transition: opacity .15s ease;
  }
  .brand button:hover { opacity: .7; }
  .brand button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  .brand .dot { color: var(--accent); }
  /* 检测中时点号转起来，作为「正在刷新」的反馈 */
  .brand button.busy .dot {
    display: inline-block;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tagline { color: var(--muted); font-size: 15px; margin: 0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 14px;
  }

  .card {
    position: relative;
    display: block;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow);
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, background .16s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--border-hover);
    background: var(--card-hover);
    box-shadow: var(--shadow-hover);
  }
  .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .card.down { opacity: .62; }

  /* 低调卡片：次要服务（电影资源库）——透明底、淡字、无边框 */
  .card.muted {
    background: transparent;
    border: 1px dashed var(--border);
    box-shadow: none;
    opacity: .62;
    padding: 14px 18px;
  }
  .card.muted:hover {
    background: transparent;
    border-color: var(--border-hover);
    box-shadow: none;
    transform: none;
    opacity: .85;
  }
  .card.muted .icon { font-size: 15px; opacity: .8; }
  .card.muted .name { font-size: 13px; font-weight: 500; }
  .card.muted .desc { font-size: 12px; margin-bottom: 8px; }
  .card.muted .host { font-size: 10.5px; }
  .card.muted .status { font-size: 10px; }

  .card-top {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }
  .icon { font-size: 20px; line-height: 1; }
  .name { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }

  .status {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .led {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--faint);
    flex: none;
  }
  .status[data-s="up"] .led   { background: #35c07a; box-shadow: 0 0 0 3px rgba(53,192,122,.16); }
  .status[data-s="up"]        { color: #35c07a; }
  .status[data-s="down"] .led { background: #e0574a; box-shadow: 0 0 0 3px rgba(224,87,74,.14); }
  .status[data-s="down"]      { color: #e0574a; }
  .status[data-s="check"] .led { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }

  .desc {
    font-size: 13px; line-height: 1.55; color: var(--muted);
    margin: 0 0 12px;
  }
  .host {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--faint);
    word-break: break-all;
  }

  .pending {
    display: inline-block;
    margin-left: 6px; padding: 1px 6px;
    font-size: 10px; font-family: var(--mono);
    color: var(--accent);
    border: 1px solid currentColor; border-radius: 4px;
    opacity: .8; vertical-align: 1px;
  }

  footer {
    margin-top: 40px; padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 12px; color: var(--faint);
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  }
  footer .sep { flex: 1 }
  #theme {
    background: none; border: 1px solid var(--border); border-radius: 7px;
    color: var(--muted); font: inherit; font-size: 12px;
    padding: 4px 10px; cursor: pointer;
  }
  #theme:hover { border-color: var(--border-hover); color: var(--text); }

  @media (max-width: 560px) {
    .wrap { padding: 48px 18px 40px; }
    .brand button { font-size: 25px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">
      <button id="brand-btn" type="button" title="点击重新检测各服务状态">
        readcine<span class="dot">.</span>
      </button>
    </h1>
    <p class="tagline">主站二级页面跳转</p>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    <span id="stamp">—</span>
    <span class="sep"></span>
    <button id="theme" type="button">主题</button>
  </footer>
</div>

<script>
// 加新服务只改这个数组：url 填最终要用的地址，fallback 填域名没通时的临时地址
const SERVICES = [
  {
    icon: '📡',
    name: 'AI 情报站',
    desc: '全球 AI 编程助手与 Agent 官方更新，中文提炼。',
    url: 'https://ai.readcine.com',
    fallback: 'https://ai-readcine.forcine.dpdns.org',
  },
  {
    icon: '🏆',
    name: '电影获奖资讯',
    desc: '提名、获奖与流媒体预计上线时间。',
    url: 'http://news.readcine.com',
    fallback: 'https://news.readcine.com',
  },
  {
    icon: '📊',
    name: 'UsageHub',
    desc: '订阅与用量管理面板。',
    url: 'https://usage.readcine.com',
    fallback: 'https://usagehub.forcine.dpdns.org',
  },
  {
    icon: '🎬',
    name: '电影资源库',
    desc: '资源站，本机 8080 反代。',
    url: 'https://movie.readcine.com',
    fallback: 'https://movieupdate.forcine.dpdns.org',
  },
];

const grid = document.getElementById('grid');

const cards = SERVICES.map(svc => {
  const a = document.createElement('a');
  a.className = 'card' + (svc.muted ? ' muted' : '');
  a.href = svc.url;
  a.rel = 'noopener';

  const host = new URL(svc.url).host;
  a.innerHTML = `
    <div class="card-top">
      <span class="icon">${svc.icon}</span>
      <span class="name">${svc.name}</span>
      <span class="status" data-s="check"><span class="led"></span><span class="txt">检测中</span></span>
    </div>
    <p class="desc">${svc.desc}</p>
    <div class="host">${host}</div>`;

  grid.appendChild(a);
  return { svc, el: a };
});

// 探活：no-cors 只能知道「连不连得上」，够用了；连不上就退回 fallback
function probe(url, ms = 6000) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  return fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctl.signal })
    .then(() => true).catch(() => false)
    .finally(() => clearTimeout(timer));
}

function setStatus(el, state, text) {
  const s = el.querySelector('.status');
  s.dataset.s = state;
  s.querySelector('.txt').textContent = text;
}

async function check({ svc, el }) {
  if (await probe(svc.url)) {
    setStatus(el, 'up', '在线');
    return;
  }
  if (svc.fallback && await probe(svc.fallback)) {
    // 正式域名没通，但备用地址活着：改指备用，并标注
    el.href = svc.fallback;
    el.querySelector('.host').innerHTML =
      `${new URL(svc.fallback).host}<span class="pending">域名待生效</span>`;
    setStatus(el, 'up', '在线');
    return;
  }
  el.classList.add('down');
  setStatus(el, 'down', '离线');
}

const brandBtn = document.getElementById('brand-btn');
let refreshing = false;

async function refresh() {
  if (refreshing) return;                 // 连点不重复跑
  refreshing = true;
  brandBtn.classList.add('busy');
  // 重新探活前把卡片打回「检测中」，否则看不出点击有反应
  for (const { el } of cards) {
    el.classList.remove('down');
    setStatus(el, 'check', '检测中');
  }
  try {
    await Promise.all(cards.map(check));
    document.getElementById('stamp').textContent =
      '最后检测 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
  } finally {
    brandBtn.classList.remove('busy');
    refreshing = false;
  }
}

brandBtn.addEventListener('click', refresh);
refresh();

// 主题：跟随系统，可手动覆盖
const KEY = 'forcine-theme';
const saved = localStorage.getItem(KEY);
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('theme').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme
    ? root.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  localStorage.setItem(KEY, root.dataset.theme);
};

// 数字键 1-9 直达
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const i = parseInt(e.key, 10) - 1;
  if (i >= 0 && cards[i]) location.href = cards[i].el.href;
});
</script>
</body>
</html>
