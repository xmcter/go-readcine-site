<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="readcine 各站入口：片库、导赏、电影活动、银幕新讯、整理器。">
<title>readcine · 导航</title>
<style>
  :root {
    --bg: #f4f5f2; --bg-grad: radial-gradient(1200px 600px at 50% -10%, #e9ebe4 0%, transparent 70%);
    --card: #ffffff; --border: #dcdfd9; --text: #14181f; --muted: #565f6b; --faint: #8b939c; --accent: #c8722c;
    --shadow: 0 1px 2px rgba(20,23,28,.06), 0 8px 24px rgba(20,23,28,.06);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0f14; --bg-grad: radial-gradient(1200px 600px at 50% -10%, #171c22 0%, transparent 70%);
      --card: #12161d; --border: #262b33; --text: #e7ebe6; --muted: #9aa3ab; --faint: #6b7480; --accent: #e08a45; --shadow: none; }
  }
  :root[data-theme="dark"] { --bg: #0c0f14; --bg-grad: radial-gradient(1200px 600px at 50% -10%, #171c22 0%, transparent 70%);
    --card: #12161d; --border: #262b33; --text: #e7ebe6; --muted: #9aa3ab; --faint: #6b7480; --accent: #e08a45; --shadow: none; }
  :root[data-theme="light"] { --bg: #f4f5f2; --card: #ffffff; --border: #dcdfd9; --text: #14181f; --muted: #565f6b; --faint: #8b939c; --accent: #c8722c; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); background-image: var(--bg-grad); background-repeat: no-repeat; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 72px 24px 56px; }
  .brand button { font: inherit; font-size: 30px; font-weight: 650; letter-spacing: -.02em; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .brand .dot { color: var(--accent); }
  .tagline { color: var(--muted); font-size: 15px; margin: 8px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card { display: block; padding: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; text-decoration: none; color: inherit; box-shadow: var(--shadow); }
  .card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .name { font-size: 16px; font-weight: 600; }
  .status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--faint); }
  .led { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .status[data-s="up"] .led { background: #35c07a; } .status[data-s="up"] { color: #35c07a; }
  .status[data-s="up"], .status[data-s="check"] { visibility: hidden; }
  .status[data-s="down"] .led { background: #e0574a; } .status[data-s="down"] { color: #e0574a; }
  .desc { font-size: 13px; line-height: 1.55; color: var(--muted); margin: 0 0 12px; }
  .peek { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .peek li { display: grid; grid-template-columns: auto 1fr; gap: 8px; font-size: 13px; line-height: 1.45; }
  .peek .when { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; padding-top: 2px; }
  .host { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
  .header-main { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .site-traffic {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-family: var(--mono);
    color: var(--muted); background: var(--card); border: 1px solid var(--border); padding: 5px 14px;
    border-radius: 20px; box-shadow: var(--shadow);
  }
  .traffic-pulse {
    width: 6px; height: 6px; border-radius: 50%; background: #35c07a;
    box-shadow: 0 0 0 2.5px rgba(53, 192, 122, 0.25); animation: traffic-glow 2s infinite;
  }
  @keyframes traffic-glow {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.8; }
  }
  .site-traffic .traffic-item strong { color: var(--text); font-weight: 650; }
  .site-traffic .traffic-sep { color: var(--border); margin: 0 1px; }
  .card-footer {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px;
    padding-top: 8px; border-top: 1px dashed var(--border);
  }
  .card-traffic {
    font-family: var(--mono); font-size: 11px; color: var(--faint);
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .card-traffic .t-today { color: var(--accent); font-weight: 600; }
  .card-traffic .t-yesterday { color: var(--muted); font-weight: 550; }
  .card-traffic .t-sep { color: var(--border); }
  footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--faint); display: flex; gap: 8px 16px; align-items: center; }
  footer .sep { flex: 1 }
  #theme { background: none; border: 1px solid var(--border); border-radius: 7px; color: var(--muted); font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-main">
      <h1 class="brand"><button id="brand-btn" type="button">readcine<span class="dot">.</span></button></h1>
      <div class="site-traffic" id="site-traffic" title="独立访客人数 (UV)：同一自然人当天无论刷新或进入多少次只计 1 人">
        <span class="traffic-pulse"></span>
        <span class="traffic-item">主站今日 <strong id="stat-site-today">—</strong></span>
        <span class="traffic-sep">/</span>
        <span class="traffic-item">昨日 <strong id="stat-site-yesterday">—</strong></span>
      </div>
    </div>
    <p class="tagline">卡片里是最近更新 · 点卡片进站 · 点标题刷新状态</p>
  </header>
  <main class="grid" id="grid"></main>
  <footer><span id="stamp">—</span><span class="sep"></span><button id="theme" type="button">浅色</button></footer>
</div>
<script>
const SERVICES = [
  // 公网站点挂在这里。只给自己用的放在 /private/。
  { id: 'movie', icon: '🎬', name: '电影资源库', desc: '片库检索与更新。', url: 'https://movie.readcine.com', fallback: 'https://movieupdate.forcine.dpdns.org' },
  { id: 'guide', icon: '🎞', name: '电影导赏', desc: '选片之前先看导赏。评分、奖项和主创在一张卡上，默认不剧透。', url: 'https://guide.readcine.com' },
  { id: 'events', icon: '📅', name: '电影活动', desc: '长沙非院线放映日历。', url: 'https://events.readcine.com' },
  { id: 'news', icon: '🏆', name: '银幕新讯', desc: '作者向新片、A类电影节与奖讯。不收爆米花。', url: 'https://news.readcine.com', fallback: 'https://xmcter.github.io/movie-awards-site/', cors: true },
  { id: 'organize', icon: '📱', name: '电影整理器', desc: 'Android 本地/SMB 影片刮削整理与海报墙，APK 下载。', url: 'https://organize.readcine.com', cors: true },
  { id: 'ai', icon: '📡', name: 'AI 情报站', desc: 'AI 工具与 Agent 更新，中文提炼。', url: 'https://ai.readcine.com', fallback: 'https://ai-readcine.forcine.dpdns.org', cors: true },
  { id: 'deals', icon: '🏷️', name: 'CodingPlan Deals', desc: '编程套餐折扣雷达，时间线与优惠情报。', url: 'https://deals.readcine.com', fallback: 'https://go.readcine.com/deals/', cors: true }
];
const PEEK_URL = 'https://movie.readcine.com/api/peek';
const JUNK_RE = /(ARASHI|AROUND ASIA|演唱会|音乐会|巡演|音乐节|concert|tour live|MV合集)/i;
const grid = document.getElementById('grid');
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function whenKey(w){
  const s=String(w||'').trim();
  const m=s.match(/(\d{4})[-\/\.](\d{1,2})[-\/\.](\d{1,2})/);
  if(m) return m[1]+String(m[2]).padStart(2,'0')+String(m[3]).padStart(2,'0');
  const md=s.match(/(\d{1,2})[-\/\.](\d{1,2})/);
  if(md) return '2026'+String(md[1]).padStart(2,'0')+String(md[2]).padStart(2,'0');
  return '00000000';
}
function newestFirst(items){
  return (items||[]).slice().sort((a,b)=>whenKey(b.when).localeCompare(whenKey(a.when)));
}
function peekHtml(items){return '<ul class="peek">'+items.slice(0,3).map(it=>'<li><span class="when">'+esc(it.when||'')+'</span><span>'+esc(it.text||'')+'</span></li>').join('')+'</ul>';}
function renderPeek(el,items){
  if(!items||!items.length) return;
  const footer=el.querySelector('.card-footer') || el.querySelector('.host');
  const old=el.querySelector('.peek');
  const wrap=document.createElement('div');
  wrap.innerHTML=peekHtml(newestFirst(items));
  const node=wrap.firstElementChild;
  if(old) old.replaceWith(node);
  else if(footer) footer.before(node);
  else el.appendChild(node);
}
function fmtWhen(iso){
  const m=String(iso||'').match(/(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return '';
  return m[2]+'-'+m[3];
}
function cleanTitle(t){
  return String(t||'').replace(/\s+/g,' ').trim();
}
function isJunkTitle(t){
  const s=cleanTitle(t);
  if(!s || s.length<2) return true;
  if(JUNK_RE.test(s)) return true;
  if(/^[A-Z0-9 .]{20,}$/.test(s) && /\b(IN|TOKYO|ASIA|LIVE)\b/.test(s)) return true;
  return false;
}
const cards=SERVICES.map(svc=>{
  const a=document.createElement('a');
  a.className='card'; a.href=svc.url; a.rel='noopener'; a.dataset.id=svc.id;
  a.innerHTML='<div class="card-top"><span class="icon">'+svc.icon+'</span><span class="name">'+svc.name+'</span><span class="status" data-s="check"><span class="led"></span><span class="txt"></span></span></div><p class="desc">'+svc.desc+'</p>' +
    '<div class="card-footer">' +
      '<div class="host">'+new URL(svc.url).host+'</div>' +
      '<div class="card-traffic" id="traffic-'+svc.id+'">今日 <span class="t-today">—</span><span class="t-sep">/</span>昨日 <span class="t-yesterday">—</span></div>' +
    '</div>';
  grid.appendChild(a);
  return {svc,el:a};
});
async function loadHeadlines(){
  try{
    const res=await fetch('headlines.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) return;
    const data=await res.json();
    for(const {svc,el} of cards){
      const items=data[svc.id]||[];
      renderPeek(el, items);
    }
  }catch(e){}
}
async function loadMoviePeek(){
  const movie=cards.find(c=>c.svc.id==='movie');
  if(!movie) return;
  try{
    const res=await fetch(PEEK_URL,{cache:'no-store',mode:'cors'});
    if(!res.ok) return;
    const data=await res.json();
    const rows=(data&&data.data)||[];
    const items=[];
    const seen=new Set();
    for(const row of rows){
      const title=cleanTitle(row.title);
      if(isJunkTitle(title)) continue;
      const key=title.replace(/[《》]/g,'').toLowerCase();
      if(seen.has(key)) continue;
      seen.add(key);
      items.push({when:fmtWhen(row.posted_at||row.updated_at), text:'《'+title+'》'});
      if(items.length>=3) break;
    }
    if(items.length) renderPeek(movie.el, items);
  }catch(e){}
}
async function probe(url,opts){const cors=opts&&opts.cors;const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),5000);try{if(cors){try{const head=await fetch(url,{method:'HEAD',mode:'cors',cache:'no-store',signal:ctl.signal});return head.ok;}catch{const res=await fetch(url,{method:'GET',mode:'cors',cache:'no-store',signal:ctl.signal});return res.ok;}}await fetch(url,{mode:'no-cors',cache:'no-store',signal:ctl.signal});return true;}catch{return false;}finally{clearTimeout(timer);}}
function setStatus(el,state,text){const s=el.querySelector('.status');s.dataset.s=state;s.querySelector('.txt').textContent=text;}
async function check(card){const svc=card.svc,el=card.el;
  // CORS failure alone must not send a healthy brand domain to fallback.
  if(await probe(svc.url,{cors:!!svc.cors}) || (svc.cors && await probe(svc.url))){setStatus(el,'up','');return;}
  if(svc.fallback&&(await probe(svc.fallback,{cors:!!svc.cors})||await probe(svc.fallback))){el.href=svc.fallback;setStatus(el,'up','');return;}
  setStatus(el,'down','离线');
}
const STATS_KEY='readcine_uv_date';
const STATS_SVC_KEY='readcine_uv_visited_services';
const STATS_DELTA_KEY='readcine_uv_deltas';

async function loadStats(){
  try{
    const res=await fetch('stats.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) return;
    const data=await res.json();

    const now=new Date();
    const todayStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    let lastVisit=localStorage.getItem(STATS_KEY);
    let deltas={};

    // 跨天或首次访问：按自然日重置独立访客记录
    if(lastVisit!==todayStr){
      localStorage.setItem(STATS_KEY,todayStr);
      localStorage.removeItem(STATS_SVC_KEY); // 清空当日已访问子站集合
      deltas.site=1;                          // 本设备今日首次计入主站 UV (1人)
      localStorage.setItem(STATS_DELTA_KEY,JSON.stringify(deltas));
    }else{
      try{ deltas=JSON.parse(localStorage.getItem(STATS_DELTA_KEY)||'{}'); }catch(e){}
    }

    // 主站独立访客 (UV)
    const siteToday=(data.site?.today||0)+(deltas.site?1:0);
    const siteYest=data.site?.yesterday||0;
    const siteTodayEl=document.getElementById('stat-site-today');
    const siteYestEl=document.getElementById('stat-site-yesterday');
    if(siteTodayEl) siteTodayEl.textContent=`${siteToday.toLocaleString()} 人`;
    if(siteYestEl) siteYestEl.textContent=`${siteYest.toLocaleString()} 人`;

    // 二级域名独立访客 (UV)
    if(data.services){
      for(const [id,s] of Object.entries(data.services)){
        const el=document.getElementById('traffic-'+id);
        if(el){
          const svcToday=(s.today||0)+(deltas[id]?1:0);
          el.innerHTML=`今日 <span class="t-today">${svcToday} 人</span><span class="t-sep">/</span>昨日 <span class="t-yesterday">${s.yesterday} 人</span>`;
        }
      }
    }
  }catch(e){
    console.error('加载统计失败',e);
  }
}

// 点击卡片：严格唯一访客去重（同一人当天点击多次同一个子站只计 1 人）
grid.addEventListener('click',e=>{
  const card=e.target.closest('.card');
  if(!card) return;
  const svcId=card.dataset.id;
  if(!svcId) return;

  try{
    let visitedSet=new Set();
    try{
      const stored=JSON.parse(localStorage.getItem(STATS_SVC_KEY)||'[]');
      visitedSet=new Set(Array.isArray(stored)?stored:[]);
    }catch(err){}

    // 当天如果该访客已点击过此子站，直接跳过，绝不重复计入访问人数！
    if(visitedSet.has(svcId)){
      return;
    }

    visitedSet.add(svcId);
    localStorage.setItem(STATS_SVC_KEY,JSON.stringify([...visitedSet]));

    let deltas={};
    try{ deltas=JSON.parse(localStorage.getItem(STATS_DELTA_KEY)||'{}'); }catch(err){}
    deltas[svcId]=1;
    localStorage.setItem(STATS_DELTA_KEY,JSON.stringify(deltas));

    // 界面实时反映该访客 +1 人
    const trafficEl=document.getElementById('traffic-'+svcId);
    if(trafficEl){
      const todaySpan=trafficEl.querySelector('.t-today');
      if(todaySpan){
        const cur=parseInt(todaySpan.textContent.replace(/[^0-9]/g,''))||0;
        todaySpan.textContent=`${cur+1} 人`;
      }
    }
  }catch(err){}
});

const brandBtn=document.getElementById('brand-btn');
async function refresh(){
  for(const card of cards){
    card.el.href=card.svc.url;
    card.el.querySelector('.host').textContent=new URL(card.svc.url).host;
    setStatus(card.el,'check','');
  }
  await Promise.all([Promise.all(cards.map(check)),loadHeadlines().then(loadMoviePeek),loadStats()]);
  document.getElementById('stamp').textContent='最后检测 '+new Date().toLocaleTimeString('zh-CN',{hour12:false});
}
brandBtn.addEventListener('click',refresh);
loadHeadlines().then(loadMoviePeek);
loadStats();
refresh();
const KEY='forcine-theme';const themeBtn=document.getElementById('theme');const saved=localStorage.getItem(KEY);if(saved)document.documentElement.dataset.theme=saved;
function isDark(){const root=document.documentElement;return root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function syncThemeLabel(){themeBtn.textContent=isDark()?'浅色':'深色';}
syncThemeLabel();
themeBtn.onclick=()=>{document.documentElement.dataset.theme=isDark()?'light':'dark';localStorage.setItem(KEY,document.documentElement.dataset.theme);syncThemeLabel();};
</script>
