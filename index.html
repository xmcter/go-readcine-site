<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="readcine 各站入口：片库、银幕奖讯、AI 情报站。">
<title>readcine · 导航</title>
<style>
  :root {
    --bg: #f4f5f2;
    --bg-grad: radial-gradient(1200px 600px at 50% -10%, #e9ebe4 0%, transparent 70%);
    --card: #ffffff;
    --card-hover: #ffffff;
    --border: #dcdfd9;
    --border-hover: #c3c7bf;
    --text: #14181f;
    --muted: #565f6b;
    --faint: #8b939c;
    --accent: #c8722c;
    --shadow: 0 1px 2px rgba(20,23,28,.06), 0 8px 24px rgba(20,23,28,.06);
    --shadow-hover: 0 2px 4px rgba(20,23,28,.08), 0 16px 40px rgba(20,23,28,.12);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0f14;
      --bg-grad: radial-gradient(1200px 600px at 50% -10%, #171c22 0%, transparent 70%);
      --card: #12161d;
      --card-hover: #171c24;
      --border: #262b33;
      --border-hover: #3a414b;
      --text: #e7ebe6;
      --muted: #9aa3ab;
      --faint: #6b7480;
      --accent: #e08a45;
      --shadow: none;
      --shadow-hover: 0 12px 32px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0f14;
    --bg-grad: radial-gradient(1200px 600px at 50% -10%, #171c22 0%, transparent 70%);
    --card: #12161d;
    --card-hover: #171c24;
    --border: #262b33;
    --border-hover: #3a414b;
    --text: #e7ebe6;
    --muted: #9aa3ab;
    --faint: #6b7480;
    --accent: #e08a45;
    --shadow: none;
    --shadow-hover: 0 12px 32px rgba(0,0,0,.4);
  }
  :root[data-theme="light"] {
    --bg: #f4f5f2;
    --bg-grad: radial-gradient(1200px 600px at 50% -10%, #e9ebe4 0%, transparent 70%);
    --card: #ffffff;
    --card-hover: #ffffff;
    --border: #dcdfd9;
    --border-hover: #c3c7bf;
    --text: #14181f;
    --muted: #565f6b;
    --faint: #8b939c;
    --accent: #c8722c;
    --shadow: 0 1px 2px rgba(20,23,28,.06), 0 8px 24px rgba(20,23,28,.06);
    --shadow-hover: 0 2px 4px rgba(20,23,28,.08), 0 16px 40px rgba(20,23,28,.12);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image: var(--bg-grad);
    background-repeat: no-repeat;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 72px 24px 56px; }

  header { margin-bottom: 40px; }
  .brand { margin: 0 0 8px; }
  .brand button {
    font: inherit;
    font-size: 30px; font-weight: 650; letter-spacing: -.02em;
    color: inherit;
    background: none; border: 0; padding: 0;
    cursor: pointer;
    transition: opacity .15s ease;
  }
  .brand button:hover { opacity: .7; }
  .brand button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  .brand .dot { color: var(--accent); }
  .brand button.busy .dot {
    display: inline-block;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tagline { color: var(--muted); font-size: 15px; margin: 0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
    align-items: start;
  }

  .card {
    position: relative;
    display: block;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow);
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, background .16s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--border-hover);
    background: var(--card-hover);
    box-shadow: var(--shadow-hover);
  }
  .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .card.down { opacity: .62; }

  .card.muted {
    background: transparent;
    border: 1px dashed var(--border);
    box-shadow: none;
    opacity: .62;
    padding: 14px 18px;
  }
  .card.muted:hover {
    background: transparent;
    border-color: var(--border-hover);
    box-shadow: none;
    transform: none;
    opacity: .85;
  }
  .card.muted .icon { font-size: 15px; opacity: .8; }
  .card.muted .name { font-size: 13px; font-weight: 500; }
  .card.muted .desc { font-size: 12px; margin-bottom: 8px; }
  .card.muted .host { font-size: 10.5px; }
  .card.muted .status { font-size: 10px; }

  .card-top {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }
  .icon { font-size: 20px; line-height: 1; }
  .name { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }

  .status {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .led {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--faint);
    flex: none;
  }
  .status[data-s="up"] .led   { background: #35c07a; box-shadow: 0 0 0 3px rgba(53,192,122,.16); }
  .status[data-s="up"]        { color: #35c07a; }
  .status[data-s="down"] .led { background: #e0574a; box-shadow: 0 0 0 3px rgba(224,87,74,.14); }
  .status[data-s="down"]      { color: #e0574a; }
  .status[data-s="check"] .led { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }

  .desc {
    font-size: 13px; line-height: 1.55; color: var(--muted);
    margin: 0 0 12px;
  }
  .peek {
    list-style: none;
    margin: 0 0 14px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .peek li {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px;
    font-size: 13px;
    line-height: 1.45;
    color: var(--text);
  }
  .peek .when {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--faint);
    padding-top: 2px;
    white-space: nowrap;
  }
  .host {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--faint);
    word-break: break-all;
  }

  .pending {
    display: inline-block;
    margin-left: 6px; padding: 1px 6px;
    font-size: 10px; font-family: var(--mono);
    color: var(--accent);
    border: 1px solid currentColor; border-radius: 4px;
    opacity: .8; vertical-align: 1px;
  }

  footer {
    margin-top: 40px; padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 12px; color: var(--faint);
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  }
  footer .sep { flex: 1 }
  #theme {
    background: none; border: 1px solid var(--border); border-radius: 7px;
    color: var(--muted); font: inherit; font-size: 12px;
    padding: 4px 10px; cursor: pointer;
  }
  #theme:hover { border-color: var(--border-hover); color: var(--text); }

  @media (max-width: 560px) {
    .wrap { padding: 48px 18px 40px; }
    .brand button { font-size: 25px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">
      <button id="brand-btn" type="button" title="点击重新检测各服务状态">
        readcine<span class="dot">.</span>
      </button>
    </h1>
    <p class="tagline">各站最近更新 · 点卡片进站 · 点标题刷新状态</p>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    <span id="stamp">—</span>
    <span class="sep"></span>
    <button id="theme" type="button">浅色</button>
  </footer>
</div>

<script>
const SERVICES = [
  {
    id: 'movie',
    icon: '🎬',
    name: '电影资源库',
    desc: '片库检索与更新。',
    url: 'https://movieupdate.forcine.dpdns.org',
    fallback: 'https://movie-readcine.forcine.dpdns.org',
  },
  {
    id: 'news',
    icon: '🏆',
    name: '电影获奖资讯',
    desc: '提名、获奖与流媒体预计上线时间。',
    url: 'https://news.readcine.com',
    fallback: 'https://xmcter.github.io/movie-awards-site/',
    cors: true,
  },
  {
    id: 'ai',
    icon: '📡',
    name: 'AI 情报站',
    desc: 'AI 工具与 Agent 更新，中文提炼。',
    url: 'https://ai.readcine.com',
    fallback: 'https://ai-readcine.forcine.dpdns.org',
    cors: true,
  },
];

const grid = document.getElementById('grid');

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&', '<': '<', '>': '>', '"': '"', "'": '&#39;'
  }[c]));
}

function peekHtml(items) {
  if (!items || !items.length) return '';
  return `<ul class="peek">${items.slice(0, 3).map(it =>
    `<li><span class="when">${esc(it.when || '')}</span><span>${esc(it.text || '')}</span></li>`
  ).join('')}</ul>`;
}

function renderPeek(el, items) {
  const host = el.querySelector('.host');
  const old = el.querySelector('.peek');
  if (old) old.remove();
  if (!items || !items.length) return;
  const wrap = document.createElement('div');
  wrap.innerHTML = peekHtml(items);
  host.before(wrap.firstElementChild);
}

const cards = SERVICES.map(svc => {
  const a = document.createElement('a');
  a.className = 'card' + (svc.muted ? ' muted' : '');
  a.href = svc.url;
  a.rel = 'noopener';

  const host = new URL(svc.url).host;
  a.innerHTML = `
    <div class="card-top">
      <span class="icon">${svc.icon}</span>
      <span class="name">${svc.name}</span>
      <span class="status" data-s="check"><span class="led"></span><span class="txt">检测中</span></span>
    </div>
    <p class="desc">${svc.desc}</p>
    <div class="host">${host}</div>`;

  grid.appendChild(a);
  return { svc, el: a };
});

async function loadHeadlines() {
  try {
    const res = await fetch('headlines.json?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    for (const { svc, el } of cards) {
      renderPeek(el, data[svc.id]);
    }
    if (data.updated) {
      const stamp = document.getElementById('stamp');
      const extra = '卡片更新 ' + data.updated;
      if (!stamp.dataset.head) {
        stamp.dataset.head = extra;
      }
    }
  } catch {
    /* 本地摘要加载失败时只保留站点说明 */
  }
}

async function probe(url, { cors = false, ms = 6000 } = {}) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try {
    if (cors) {
      try {
        const head = await fetch(url, { method: 'HEAD', mode: 'cors', cache: 'no-store', signal: ctl.signal });
        return head.ok;
      } catch {
        const res = await fetch(url, { method: 'GET', mode: 'cors', cache: 'no-store', signal: ctl.signal });
        return res.ok;
      }
    }
    await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctl.signal });
    return true;
  } catch {
    return false;
  } finally {
    clearTimeout(timer);
  }
}

function setStatus(el, state, text) {
  const s = el.querySelector('.status');
  s.dataset.s = state;
  s.querySelector('.txt').textContent = text;
}

function markFallback(el, fallback) {
  el.href = fallback;
  el.querySelector('.host').innerHTML =
    `${new URL(fallback).host}<span class="pending">走备用地址</span>`;
}

async function check({ svc, el }) {
  if (svc.forceFallback && svc.fallback) {
    markFallback(el, svc.fallback);
    if (await probe(svc.fallback, { cors: !!svc.cors }) || await probe(svc.fallback)) {
      setStatus(el, 'up', '在线');
      return;
    }
    el.classList.add('down');
    setStatus(el, 'down', '离线');
    return;
  }

  if (await probe(svc.url, { cors: !!svc.cors })) {
    setStatus(el, 'up', '在线');
    return;
  }
  if (svc.fallback && (await probe(svc.fallback, { cors: !!svc.cors }) || await probe(svc.fallback))) {
    markFallback(el, svc.fallback);
    setStatus(el, 'up', '在线');
    return;
  }
  el.classList.add('down');
  setStatus(el, 'down', '离线');
}

const brandBtn = document.getElementById('brand-btn');
let refreshing = false;

async function refresh() {
  if (refreshing) return;
  refreshing = true;
  brandBtn.classList.add('busy');
  for (const { el, svc } of cards) {
    el.classList.remove('down');
    el.href = svc.url;
    el.querySelector('.host').textContent = new URL(svc.url).host;
    setStatus(el, 'check', '检测中');
  }
  try {
    await Promise.all([Promise.all(cards.map(check)), loadHeadlines()]);
    const head = document.getElementById('stamp').dataset.head;
    document.getElementById('stamp').textContent =
      (head ? head + ' · ' : '') +
      '最后检测 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
  } finally {
    brandBtn.classList.remove('busy');
    refreshing = false;
  }
}

brandBtn.addEventListener('click', refresh);
refresh();

const KEY = 'forcine-theme';
const themeBtn = document.getElementById('theme');
const saved = localStorage.getItem(KEY);
if (saved) document.documentElement.dataset.theme = saved;

function isDark() {
  const root = document.documentElement;
  return root.dataset.theme
    ? root.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
}
function syncThemeLabel() {
  themeBtn.textContent = isDark() ? '浅色' : '深色';
}
syncThemeLabel();
themeBtn.onclick = () => {
  document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
  localStorage.setItem(KEY, document.documentElement.dataset.theme);
  syncThemeLabel();
};

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const i = parseInt(e.key, 10) - 1;
  if (i >= 0 && cards[i]) location.href = cards[i].el.href;
});
</script>
</body>
</html>
