  }

  :root[data-theme="light"] { --bg: #f5f5f7; --card: #ffffff; --border: #d2d2d7; --text: #1d1d1f; --muted: #6e6e73; --faint: #6e6e73; --accent: #0058b0; }

  @media (max-width:640px) { .grid { grid-template-columns: 1fr; } footer button { min-height:44px; } }

  .status[data-s="up"] .led { background: #35c07a; } .status[data-s="up"] { color: #35c07a; }
  .status[data-s="up"], .status[data-s="check"] { visibility: hidden; }
  .status[data-s="down"] .led { background: #e0574a; } .status[data-s="down"] { color: #e0574a; }
  .peek { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

  .peek { min-height: 21px; } /* 1 行 × 13px×1.45：数据回来前先占位，卡片不跳 (CLS) */
  .peek li > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

<script>
const SERVICES = [
  // 公网站点挂在这里。只给自己用的放在 /private/。
  { id: 'movie', icon: '/icons/movie.svg', name: '电影', desc: '资讯与导赏合流页：资讯为默认标签，导赏为第二标签。', url: 'https://guide.readcine.com/cinema.html', fallback: 'https://news.readcine.com' },
  { id: 'ai', icon: '/icons/ai.svg', name: 'AI 情报站', desc: '限时额度、免费机会与优惠折扣，优先看仍可领取的福利。', url: 'https://ai.readcine.com/', fallback: 'https://ai.readcine.com' },
];
const PEEK_IDS = new Set(['movie','ai']); // 有「最近更新」的卡片，先占位
const JUNK_RE = /(ARASHI|AROUND ASIA|演唱会|音乐会|巡演|音乐节|concert|tour live|MV合集)/i;
const grid = document.getElementById('grid');
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function whenKey(w){
  const s=String(w||'').trim();
  const m=s.match(/(\d{4})[-\/\.](\d{1,2})[-\/\.](\d{1,2})/);
  if(m) return m[1]+String(m[2]).padStart(2,'0')+String(m[3]).padStart(2,'0');
  const md=s.match(/(\d{1,2})[-\/\.](\d{1,2})/);
  if(md) return '2026'+String(md[1]).padStart(2,'0')+String(md[2]).padStart(2,'0');
  return '00000000';
}
function newestFirst(items){
  return (items||[]).slice().sort((a,b)=>whenKey(b.when).localeCompare(whenKey(a.when)));
}
function peekHtml(items){return '<ul class="peek">'+items.slice(0,1).map(it=>'<li><span class="when">'+esc(it.when||fmtWhen(it.date)||'')+'</span><span>'+esc(it.text||it.title||'')+'</span></li>').join('')+'</ul>';}
function renderPeek(el,items){
  if(!items||!items.length) return;
  const footer=el.querySelector('.card-footer') || el.querySelector('.host');
  const old=el.querySelector('.peek');
  const wrap=document.createElement('div');
  wrap.innerHTML=peekHtml(newestFirst(items));
  const node=wrap.firstElementChild;
  if(old) old.replaceWith(node);
  else if(footer) footer.before(node);
  else el.appendChild(node);
}
function fmtWhen(iso){
  const m=String(iso||'').match(/(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return '';
  return m[2]+'-'+m[3];
}
function cleanTitle(t){
  return String(t||'').replace(/\s+/g,' ').trim();
}
function isJunkTitle(t){
  const s=cleanTitle(t);
  if(!s || s.length<2) return true;
  if(JUNK_RE.test(s)) return true;
  if(/^[A-Z0-9 .]{20,}$/.test(s) && /\b(IN|TOKYO|ASIA|LIVE)\b/.test(s)) return true;
  return false;
}
const cards=SERVICES.map(svc=>{
  const a=document.createElement('a');
  a.className='card'; a.href=svc.url; a.rel='noopener'; a.dataset.id=svc.id;
  a.innerHTML='<div class="card-top"><img class="icon" src="'+esc(svc.icon)+'" width="36" height="36" alt=""><span class="name">'+svc.name+'</span><span class="status" data-s="check"><span class="led"></span><span class="txt"></span></span></div><p class="desc">'+esc(svc.desc)+'</p>' +
    (PEEK_IDS.has(svc.id) ? '<ul class="peek"></ul>' : '') +
    '<div class="card-footer">' +
      '<div class="card-traffic" id="traffic-'+svc.id+'" style="display:none"></div>' +
    '</div>';
  grid.appendChild(a);
  return {svc,el:a};
});

const HEADLINES_CACHE_KEY = 'readcine_headlines_cache';

function applyHeadlines(data){
  if(!data) return;
  for(const {svc,el} of cards){
    const items=svc.id==='movie'?(data.movie||data.news||[]):(data[svc.id]||[]);
    renderPeek(el, items);
  }
}

// Every source has its own timeout and only updates its own card. Slow or failed
// live requests never delay cached headlines or overwrite another source.
async function fetchJson(url, timeout=4500){
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),timeout);
  try{
    const res=await fetch(url,{signal:ctl.signal});
    if(!res.ok) throw new Error('HTTP '+res.status);
    return await res.json();
  }finally{ clearTimeout(timer); }
}
let headlineGeneration=0;
async function loadHeadlines(){
  const generation=++headlineGeneration;
  let data={};
  try{ data=JSON.parse(localStorage.getItem(HEADLINES_CACHE_KEY)||'{}')||{}; }catch(_){}
  applyHeadlines(data);
  const live=new Set();
  function update(patch){
    if(generation!==headlineGeneration) return;
    data={...data,...patch};
    applyHeadlines(patch);
    try{ localStorage.setItem(HEADLINES_CACHE_KEY,JSON.stringify(data)); }catch(_){}
  }
  const lightweight=fetchJson('headlines.json',2500).then(fb=>{
    const patch={};
    if(!live.has('movie') && (fb.movie||fb.news)?.length) patch.movie=fb.movie||fb.news;
    if(!live.has('ai') && fb.ai?.length) patch.ai=fb.ai;
    update(patch);
  }).catch(()=>{});
  const movie=fetchJson('https://raw.githubusercontent.com/xmcter/movie-awards-site/main/src/data/auteur-news.json').then(arr=>{
    const latest=(Array.isArray(arr)?arr:[]).filter(x=>x.summary||x.title).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0];
    if(latest){ live.add('movie'); update({movie:[{when:fmtWhen(latest.date),text:latest.summary||latest.title}]}); }
  }).catch(()=>{});
  const ai=fetchJson('https://ai.readcine.com/feed.json').then(feed=>{
    const list=feed.updates||feed.items||[];
    const latest=(Array.isArray(list)?list:[]).filter(x=>x.title||x.text).sort((a,b)=>String(b.when||b.date||'').localeCompare(String(a.when||a.date||'')))[0];
    if(latest){ live.add('ai'); update({ai:[{when:fmtWhen(latest.when||latest.date),text:String(latest.title||latest.text).slice(0,60)}]}); }
  }).catch(()=>{});
  await Promise.allSettled([lightweight,movie,ai]);
}
async function probe(url){
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),2500);
  try{
    await fetch(url,{mode:'no-cors',cache:'no-store',signal:ctl.signal});
    return true;
  }catch{
    return false;
  }finally{
    clearTimeout(timer);
  }
}

function setStatus(el,state,text){const s=el.querySelector('.status');s.dataset.s=state;s.querySelector('.txt').textContent=text;}

async function check(card){
  const svc=card.svc,el=card.el;
  if(await probe(svc.url)){setStatus(el,'up','');return;}
  if(svc.fallback&&await probe(svc.fallback)){el.href=svc.fallback;setStatus(el,'up','');return;}
  setStatus(el,'down','离线');
}
const STATS_KEY='readcine_uv_date';
const STATS_SVC_KEY='readcine_uv_visited_services';
const STATS_DELTA_KEY='readcine_uv_deltas';
const ADMIN_KEY='readcine_admin_ignore';

// 检测 URL query: ?admin 或 ?ignore 快速激活免统计模式
const urlParams=new URLSearchParams(window.location.search);
if(urlParams.has('admin')||urlParams.has('ignore')){
  localStorage.setItem(ADMIN_KEY,'1');
  localStorage.removeItem(STATS_DELTA_KEY);
  localStorage.removeItem(STATS_SVC_KEY);
}

function isAdminMode(){
  return localStorage.getItem(ADMIN_KEY)==='1';
}

let currentStats={site:{today:0,yesterday:0},services:{}};

function renderSiteTraffic(today,yesterday){
  const el=document.getElementById('site-traffic');
  if(!el) return;
  const items=[];
  if(today>0){
    items.push('<span class="traffic-item">主站今日 <strong id="stat-site-today">'+today.toLocaleString()+' 人</strong></span>');
  }
  if(yesterday>0){
    items.push('<span class="traffic-item">昨日 <strong id="stat-site-yesterday">'+yesterday.toLocaleString()+' 人</strong></span>');
  }
  if(items.length>0){
    el.innerHTML='<span class="traffic-pulse"></span>'+items.join('<span class="traffic-sep">/</span>');
    el.style.display='';
  }else{
    el.innerHTML='';
    el.style.display='none';
  }
}

function renderCardTraffic(el,today,yesterday){
  if(!el) return;
  const items=[];
  if(today>0){
    items.push('今日 <span class="t-today">'+today.toLocaleString()+' 人</span>');
  }
  if(yesterday>0){
    items.push('昨日 <span class="t-yesterday">'+yesterday.toLocaleString()+' 人</span>');
  }
  if(items.length>0){
    el.innerHTML=items.join('<span class="t-sep">/</span>');
    el.style.display='';
  }else{
    el.innerHTML='';
    el.style.display='none';
  }
}

const STATS_DATA_CACHE_KEY = 'readcine_stats_cache';

function applyStats(data){
  if(!data) return;
  const now=new Date();
  const todayStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  let lastVisit=localStorage.getItem(STATS_KEY);
  let deltas={};

  if(isAdminMode()){
    deltas={};
  }else if(lastVisit!==todayStr){
    deltas={};
  }else{
    try{ deltas=JSON.parse(localStorage.getItem(STATS_DELTA_KEY)||'{}'); }catch(e){}
  }

  const siteToday=(data.site?.today||0)+(deltas.site?1:0);
  const siteYest=data.site?.yesterday||0;
  currentStats.site.today=siteToday;
  currentStats.site.yesterday=siteYest;
  renderSiteTraffic(siteToday,siteYest);

  if(data.services){
    for(const [id,s] of Object.entries(data.services)){
      const svcToday=(s.today||0)+(deltas[id]?1:0);
      const svcYest=s.yesterday||0;
      currentStats.services[id]={today:svcToday,yesterday:svcYest};
      const el=document.getElementById('traffic-'+id);
      if(el){
        renderCardTraffic(el,svcToday,svcYest);
      }
    }
  }
}

async function loadStats(){
  try{
    const cached=localStorage.getItem(STATS_DATA_CACHE_KEY);
    if(cached) applyStats(JSON.parse(cached));
  }catch(_){}

  try{
    const res=await fetch('stats.json');
    if(!res.ok) return;
    const data=await res.json();
    try{ localStorage.setItem(STATS_DATA_CACHE_KEY, JSON.stringify(data)); }catch(_){}

    const now=new Date();
    const todayStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    let lastVisit=localStorage.getItem(STATS_KEY);
    let deltas={};

    // 跨天或首次访问：按自然日重置独立访客记录
    if(isAdminMode()){
      deltas={};
      localStorage.removeItem(STATS_DELTA_KEY);
      localStorage.removeItem(STATS_SVC_KEY);
    }else if(lastVisit!==todayStr){
      localStorage.setItem(STATS_KEY,todayStr);
      localStorage.removeItem(STATS_SVC_KEY); // 清空当日已访问子站集合
      deltas.site=1;                          // 本设备今日首次计入主站 UV (1人)
      localStorage.setItem(STATS_DELTA_KEY,JSON.stringify(deltas));
    }else{
      try{ deltas=JSON.parse(localStorage.getItem(STATS_DELTA_KEY)||'{}'); }catch(e){}
    }

    applyStats(data);
  }catch(e){
    console.error('加载统计失败',e);
  }
}

// 点击卡片：严格唯一访客去重（同一人当天点击多次同一个子站只计 1 人）
grid.addEventListener('click',e=>{
  if(isAdminMode()) return; // 站长免统计模式：不记录个人点击
  const card=e.target.closest('.card');
  if(!card) return;
  const svcId=card.dataset.id;
  if(!svcId) return;

  try{
    let visitedSet=new Set();
    try{
      const stored=JSON.parse(localStorage.getItem(STATS_SVC_KEY)||'[]');
      visitedSet=new Set(Array.isArray(stored)?stored:[]);
    }catch(err){}

    // 当天如果该访客已点击过此子站，直接跳过，绝不重复计入访问人数！
    if(visitedSet.has(svcId)){
      return;
    }

    visitedSet.add(svcId);
    localStorage.setItem(STATS_SVC_KEY,JSON.stringify([...visitedSet]));

    let deltas={};
    try{ deltas=JSON.parse(localStorage.getItem(STATS_DELTA_KEY)||'{}'); }catch(err){}
    deltas[svcId]=1;
    localStorage.setItem(STATS_DELTA_KEY,JSON.stringify(deltas));

    // 界面实时反映该访客 +1 人
    const trafficEl=document.getElementById('traffic-'+svcId);
    if(trafficEl){
      if(!currentStats.services[svcId]){
        currentStats.services[svcId]={today:0,yesterday:0};
      }
      currentStats.services[svcId].today+=1;
      renderCardTraffic(trafficEl,currentStats.services[svcId].today,currentStats.services[svcId].yesterday);
    }
  }catch(err){}
});

const brandBtn=document.getElementById('brand-btn');
async function runChecks(){
  await Promise.all(cards.map(check));
}

async function refresh(){
  for(const card of cards){
    card.el.href=card.svc.url;
    setStatus(card.el,'check','');
  }
  await Promise.all([runChecks(),loadHeadlines(),loadStats()]);
}
brandBtn.addEventListener('click',refresh);

// 极速首屏并行非阻塞加载：各组件利用本地缓存 0ms 即刻呈现，静默后台差量更新
loadHeadlines();
loadStats();
runChecks();
const KEY='forcine-theme';const themeBtn=document.getElementById('theme');const saved=localStorage.getItem(KEY);if(saved)document.documentElement.dataset.theme=saved;
function isDark(){const root=document.documentElement;return root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function syncThemeLabel(){themeBtn.textContent=isDark()?'浅色':'深色';}
syncThemeLabel();
themeBtn.onclick=()=>{document.documentElement.dataset.theme=isDark()?'light':'dark';localStorage.setItem(KEY,document.documentElement.dataset.theme);syncThemeLabel();};

const adminBtn=document.getElementById('admin-toggle');
function syncAdminToggle(){
  if(!adminBtn) return;
  const active=isAdminMode();
  adminBtn.classList.toggle('active',active);
  adminBtn.textContent=active?'🛡️ 站长免统计: 已开启 (已排除自访)':'🛡️ 站长免统计: 关';
}
syncAdminToggle();
if(adminBtn){
  adminBtn.onclick=()=>{
    if(isAdminMode()){
      localStorage.removeItem(ADMIN_KEY);
    }else{
      localStorage.setItem(ADMIN_KEY,'1');
      localStorage.removeItem(STATS_DELTA_KEY);
      localStorage.removeItem(STATS_SVC_KEY);
    }
    syncAdminToggle();
    location.reload();
  };
}

// 仅在非管理员模式下向普通访客注入 Cloudflare Web Analytics 探针（延迟加载，避免竞争关键资源）
if(!isAdminMode()){
  const injectAnalytics=()=>{
    const cfScript=document.createElement('script');
    cfScript.defer=true;
    cfScript.src='https://static.cloudflareinsights.com/beacon.min.js';
    cfScript.setAttribute('data-cf-beacon','{"token": "14344261ed76415c8ed6b3d387441550"}');
    document.body.appendChild(cfScript);
  };
  if('requestIdleCallback' in window){
    requestIdleCallback(injectAnalytics,{timeout:3000});
  }else{
    window.addEventListener('load',injectAnalytics);
  }
}else{
  console.log('🛡️ 站长免统计模式生效中：个人访问已排除，未向 Cloudflare 发送任何探针数据。');
}

// PWA Service Worker 注册与应用安装管理
if ('serviceWorker' in navigator) {
  const registerSW = () => {
    navigator.serviceWorker.register('/sw.js?v=5', { scope: '/' })
      .then((reg) => {
        reg.onupdatefound = () => {
          const installingWorker = reg.installing;
          if (installingWorker) {
            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('ReadCine PWA 已有新版本可用');
              }
            };
          }
        };
      })
      .catch((err) => {
        console.warn('PWA SW 注册失败:', err);
      });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    registerSW();
  } else {
    window.addEventListener('DOMContentLoaded', registerSW);
  }
}

let deferredPrompt = null;
const installBtn = document.getElementById('pwa-install');
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

if (!isStandalone && installBtn) {
  installBtn.style.display = 'inline-flex';

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-flex';
  });

  installBtn.onclick = async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    } else {
      const ua = navigator.userAgent || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      const isAndroid = /Android/.test(ua);
      if (isAndroid) {
        alert('【安装到手机桌面】\n\n1. 点击手机 Chrome 右上角三点菜单（⋮）\n2. 点击「添加到主屏幕」或「安装应用」\n3. 确认后即可在手机桌面像原生 App 一样直接启动使用。');
      } else if (isIOS) {
        alert('【添加到 iPhone 桌面】\n\n1. 点击 Safari 底部「分享」按钮（向上箭头）\n2. 向下滚动选择「添加到主屏幕」\n3. 点击右上角「添加」即可。');
      } else {
        alert('【安装为桌面应用】\n\n请点击浏览器地址栏右侧的「安装」图标，或在浏览器菜单（⋮）中选择「安装应用 / 添加到主屏幕」。');
      }
    }
  };

  window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
    console.log('ReadCine PWA 已成功安装！');
  });
}
</script>
